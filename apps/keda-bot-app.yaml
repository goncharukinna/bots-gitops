apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda-bot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/goncharukinna/bots-gitops.git
    targetRevision: HEAD
    path: manifests/keda-bot
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
