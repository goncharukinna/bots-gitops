apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: keda-bot-scaledobject
  namespace: default
spec:
  scaleTargetRef:
    name: keda-bot
  minReplicaCount: 1
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 300
  triggers:
  - type: rabbitmq
    metadata:
      protocol: amqp
      queueName: telegram_messages
      mode: QueueLength
      value: "10"
    authenticationRef:
      name: keda-rabbitmq-auth
