apiVersion: apps/v1
kind: Deployment
metadata:
  name: cat-bot
  namespace: default
  labels:
    app: cat-bot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: cat-bot
  template:
    metadata:
      labels:
        app: cat-bot
    spec:
      containers:
      - name: cat-bot
        image: docin82/cat-bot:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: cat-bot-token
              key: BOT_TOKEN
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
