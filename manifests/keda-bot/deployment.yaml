apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-bot
  namespace: default
  labels:
    app: keda-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keda-bot
  template:
    metadata:
      labels:
        app: keda-bot
    spec:
      containers:
      - name: keda-bot
        image: docin82/keda-bot:437dacadedbf38ba53b8beecf6e18c7995f028df
        imagePullPolicy: Always
        env:
        - name: BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: keda-bot-secret
              key: BOT_TOKEN
        - name: RABBITMQ_URL
          value: "amqp://admin:admin123@rabbitmq.default.svc.cluster.local:5672/"
        # --- Настройки подключения к PostgreSQL ---
        - name: DB_HOST
          value: "host.docker.internal"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "keda_bot"
        - name: DB_USER
          value: "admin"
        - name: DB_PASSWORD
          value: "mysecretpassword" # <--- ОБЯЗАТЕЛЬНО ЗАМЕНИТЕ НА РЕАЛЬНЫЙ ПАРОЛЬ
        # ------------------------------------------
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
