apiVersion: apps/v1
kind: Deployment
metadata:
  name: keda-bot
  namespace: default
  labels:
    app: keda-bot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keda-bot
  template:
    metadata:
      labels:
        app: keda-bot
    spec:
      containers:
      - name: keda-bot
        image: docin82/keda-bot:8d702155083208bb6796476301a722cdd1823e3f
        imagePullPolicy: Always
        env:
        - name: BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: keda-bot-secret
              key: BOT_TOKEN
        - name: RABBITMQ_URL
          value: "amqp://admin:admin123@rabbitmq.default.svc.cluster.local:5672/"
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
